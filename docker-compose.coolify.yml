# Coolify next to an existing Supabase on the same server: no database container of our own.
# The app joins Supabase's Docker network and keeps all its tables in the schema `lorebook`,
# owned by a role that sees nothing else (see docs/supabase.md).
#
# To move to a plain pgvector server instead, use docker-compose.yml (own `db` container)
# or point DATABASE_URL at any PostgreSQL with pgvector and leave DB_SCHEMA empty.
#
# Set in Coolify: DATABASE_URL, DB_SCHEMA=lorebook, SECRET_KEY, SUPABASE_NETWORK, HUBRIS_API_KEY,
# ALLOWED_EMAILS, OWNER_EMAILS, PUBLIC_URL, SMTP_USER, SMTP_PASSWORD.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA:-lorebook}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
      # Encrypts stored API keys and signs sessions. Changing it makes stored keys unreadable.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      # The model provider; the Hubris connection is created from it at startup.
      HUBRIS_API_KEY: ${HUBRIS_API_KEY:-}
      # Accounts: only these addresses may register (comma separated). Never run a public
      # instance without it: anyone who reaches the app could spend your model credits.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?set ALLOWED_EMAILS}
      # Administrators (may change model connections); the first one owns the books that
      # existed before accounts did.
      OWNER_EMAILS: ${OWNER_EMAILS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Mail for password resets (Gmail: an app password, not the account password).
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # The embedding model would otherwise use every core of a shared server.
      OMP_NUM_THREADS: "2"
      ORT_NUM_THREADS: "2"
    volumes:
      - lorebook_data:/data
    # A shared server: the app may never take more than this.
    mem_limit: 1536m
    cpus: 1.5
    networks:
      - default
      - supabase
    labels:
      # The container sits in two networks. Without this the proxy may pick its address in
      # the Supabase network, which it cannot reach: requests then hang until they time out
      # while the app itself is fine. Coolify names the default network after the resource.
      - traefik.docker.network=${COOLIFY_NETWORK:-i4okgookssk0ccgoosswo0wg}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s

volumes:
  lorebook_data:

networks:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:?set SUPABASE_NETWORK}
